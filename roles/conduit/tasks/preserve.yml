---

- name: preserve Figure out if we need to ignore certificates on older versions
  set_fact:
    validate_certs: "{{ validate_certificates and ansible_local.mlinux.version is version('3.3.24', '>') }}"

- name: preserve Fetch preserve script
  get_url:
    url: "{{ mlinux_ttni_preserve_root[ansible_distribution_major_version] }}/preserve_config"
    validate_certs: "{{ validate_certs }}"
    dest: /etc/init.d/preserve_config
    mode: "0755"
    owner: root
    group: root

- name: preserve Enable Preserve service
  command: update-rc.d preserve_config start 39 0 6 .

- name: preserve Save a copy of the restore script
  get_url:
    url: "{{ mlinux_ttni_preserve_root[ansible_distribution_major_version] }}/restore_config"
    validate_certs: "{{ validate_certs }}"
    dest: /var/config/restore_config
    mode: "0755"
    owner: root
    group: root

- name: preserve Create restore dir
  file:
    dest: /var/config/restore.d
    state: directory
    mode: "0755"
    owner: root
    group: root

# /etc/opkg is lost on a reflash; restore.d/02feeds uses this to point
# the new image at our feeds before restore.init runs opkg.  It must
# be in place before mlinux-upgrade flashes, so it is written here.
- name: preserve /var/config/opkg
  ansible.builtin.file:
    path: /var/config/opkg
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: preserve /var/config/opkg/feeds
  ansible.builtin.template:
    src: opkg-feeds.j2
    dest: /var/config/opkg/feeds
    mode: "0644"
    owner: root
    group: root

- name: preserve Install restore scripts
  template:
    src: "{{ item }}.j2"
    dest: "/var/config/restore.d/{{ item }}"
    mode: "0755"
    owner: root
    group: root
  with_items:
    - 02feeds
    - 05restore
    - 15restore

- name: preserve Install restore initscript
  template:
    src: restore.init.j2
    dest: "/var/config/init.d/restore.init"
    mode: "0755"
    owner: root
    group: root

- name: preserve Mark restore as completed
  file:
    name: /var/lib/restore.done
    state: touch
    mode: "0644"
    owner: root
    group: root
