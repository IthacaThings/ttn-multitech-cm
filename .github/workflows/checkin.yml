---
name: push
run-name: Run some checks on push
on: [push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout config
        run: |
          git clone https://github.com/IthacaThings/ttn-multitech-config --branch ttn-ithaca-test .ttn_org
          mkdir .ttn_org/catalog
      - name: Install ttn-lw-stack
        run: |
          sudo snap install ttn-lw-stack
          sudo snap alias ttn-lw-stack.ttn-lw-cli ttn-lw-cli
          # Prevent ${HOME}/.cache from being owned by root
          mkdir -p ${HOME}/snap/ttn-lw-stack/common/ttn-lw-cli
          mkdir -p ${HOME}/.cache
      # Show how much of the unauthenticated GitHub API quota (60 an
      # hour per IP) this runner has left. This endpoint does not count
      # against it.
      - name: Show GitHub API rate limit
        run: |
          curl -sS https://api.github.com/rate_limit | jq -c .rate || true
      - name: Run syntax-check
        run: |
          bin/run make syntax-check
      - name: Run playbook-vars
        run: |
          bin/run bin/playbook_vars
#      - name: Run ansible-lint
#        run: |
#          bin/run make lint
...
